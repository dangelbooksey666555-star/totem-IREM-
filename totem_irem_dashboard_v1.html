<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTEM IREM 数据配置向导</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel2: #1c2330;
  --border: #30363d;
  --accent: #00d4aa;
  --accent2: #388bfd;
  --accent3: #ff7b72;
  --accent4: #e3b341;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #79c0ff;
  --done: #3fb950;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Noto Sans SC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
.corner-sign {
  position: fixed; z-index: 9999; pointer-events: auto; user-select: none;
  font-family: var(--mono); white-space: nowrap; backdrop-filter: blur(6px); cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.corner-sign.right {
  right: 14px; bottom: 12px; padding: 7px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: .3px;
  color: rgba(0,212,170,.96); background: rgba(13,17,23,.86);
  border: 1px solid rgba(0,212,170,.45); box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.corner-sign.right:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(0,0,0,.42); }
.corner-sign.left {
  left: 14px; bottom: 12px; padding: 4px 8px; border-radius: 6px;
  font-size: 11px; letter-spacing: .4px; color: rgba(121,192,255,.72);
  background: rgba(13,17,23,.58); border: 1px solid rgba(121,192,255,.22);
}
.corner-sign.left:hover { transform: translateY(-1px); border-color: rgba(121,192,255,.4); }

.brand-modal {
  position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center;
  background: rgba(3, 8, 14, .78); padding: 20px;
}
.brand-modal.open { display: flex; }
.brand-card {
  width: min(92vw, 560px); max-height: 90vh; overflow: auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.55);
}
.brand-card-top {
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.brand-card-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .5px; }
.brand-close {
  width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer; font-size: 16px;
}
.brand-close:hover { color: var(--text); border-color: var(--text2); }
.brand-image-wrap { padding: 16px 16px 10px; }
.brand-image {
  display:block; width:100%; height:auto; border-radius: 14px; border: 1px solid var(--border);
  background: #0b0f14;
}
.brand-note {
  padding: 0 16px 18px; line-height: 1.8; color: var(--text); font-size: 14px;
}
.brand-note strong { color: var(--accent4); }

/* ── HEADER ── */
header {
  height: 50px; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 20;
}
.logo { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 2px; }
.logo em { color: var(--text2); font-style: normal; font-weight: 400; }
.hdr-sep { width: 1px; height: 24px; background: var(--border); }
.hdr-mode-btns { display: flex; gap: 4px; }
.mode-btn {
  padding: 4px 14px; font-size: 12px; font-family: var(--mono);
  border-radius: 4px; border: 1px solid var(--border); color: var(--text2);
  cursor: pointer; background: transparent; transition: all .15s;
}
.mode-btn.active { background: rgba(0,212,170,.12); border-color: var(--accent); color: var(--accent); }
.mode-btn[data-mode="manual"].active {
  background: rgba(227,179,65,.12);
  border-color: var(--accent4);
  color: var(--accent4);
}
.hdr-progress { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width .5s ease; }
.progress-pct { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.hdr-status { font-size: 12px; color: var(--text2); font-family: var(--mono); }

/* ── 3-COLUMN LAYOUT ── */
.layout { flex: 1; display: grid; grid-template-columns: 220px 1fr 280px; min-height: 0; }

/* ── LEFT NAV ── */
.nav-panel {
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.nav-group-title {
  padding: 14px 14px 6px; font-size: 10px; font-weight: 700; color: var(--text2);
  letter-spacing: 1.5px; text-transform: uppercase; position: sticky; top: 0;
  background: var(--panel); z-index: 2;
}
.nav-group-title.static { color: var(--accent3); }
.nav-group-title.dynamic { color: var(--accent2); }
.nav-divider { height: 1px; background: var(--border); margin: 4px 0; }

.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 14px;
  cursor: pointer; border-left: 3px solid transparent; transition: all .15s;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.03); }
.nav-item.active { background: rgba(0,212,170,.07); border-left-color: var(--accent); }
.nav-item.done-item { border-left-color: var(--done); }
.nav-badge {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  background: var(--panel2); border: 1.5px solid var(--border);
  color: var(--text2); transition: all .3s;
}
.nav-item.active .nav-badge { background: var(--accent); border-color: var(--accent); color: #000; }
.nav-item.done-item .nav-badge { background: var(--done); border-color: var(--done); color: #000; }
.nav-label { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.4; }
.nav-item.active .nav-label { color: var(--text); }
.nav-item.done-item .nav-label { color: var(--text2); }
.nav-check { font-size: 12px; display: none; }
.nav-item.done-item .nav-check { display: block; }
.nav-item.done-item .nav-num-txt { display: none; }
.nav-sub { padding-left: 28px; }
.nav-sub .nav-label { font-size: 11px; }

/* ── CENTER ── */
.center-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

/* TOP: dashboard */
.dash-top {
  flex: 0 0 58%; overflow-y: auto; padding: 18px 22px;
  border-bottom: 1px solid var(--border);
}
.step-hdr { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.step-tag {
  font-family: var(--mono); font-size: 10px; white-space: nowrap; margin-top: 3px;
  padding: 3px 8px; border-radius: 3px; border: 1px solid; font-weight: 600;
}
.step-tag.static { color: var(--accent3); border-color: rgba(255,123,114,.4); background: rgba(255,123,114,.08); }
.step-tag.dynamic { color: var(--accent2); border-color: rgba(56,139,253,.4); background: rgba(56,139,253,.08); }
.step-tag.both { color: var(--accent); border-color: rgba(0,212,170,.4); background: rgba(0,212,170,.08); }
.step-title { font-size: 17px; font-weight: 700; line-height: 1.3; }
.step-desc { font-size: 12.5px; color: var(--text2); line-height: 1.6; margin-top: 3px; }

/* params */
.section-label {
  font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase;
  letter-spacing: 1px; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.choice-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.choice-card {
  flex: 1; min-width: 160px; padding: 10px 14px;
  background: var(--panel2); border: 1.5px solid var(--border);
  border-radius: 7px; cursor: pointer; transition: all .15s;
}
.choice-card:hover { border-color: rgba(0,212,170,.4); }
.choice-card.selected { border-color: var(--accent); background: rgba(0,212,170,.07); }
.choice-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.choice-desc { font-size: 11px; color: var(--text2); line-height: 1.4; }

.param-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.param-card {
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 7px; padding: 12px 14px; transition: border-color .2s;
}
.param-card:hover { border-color: rgba(0,212,170,.3); }
.param-card.wide { grid-column: 1 / -1; }
.param-lbl {
  font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase;
  letter-spacing: .7px; margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
}
.req-star { color: var(--accent3); font-size: 13px; }

/* tooltip */
.tt-wrap { position: relative; display: inline-flex; align-items: center; }
.tt-btn {
  width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
  background: rgba(56,139,253,.15); border: 1px solid rgba(56,139,253,.35);
  color: var(--accent2); font-size: 9px; font-weight: 700; font-family: var(--mono);
  display: inline-flex; align-items: center; justify-content: center; cursor: help; transition: all .2s;
}
.tt-btn:hover { background: rgba(56,139,253,.3); }
.tt-pop {
  display: none; position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  background: #1a2332; border: 1px solid var(--accent2); border-radius: 7px;
  padding: 10px 13px; font-size: 12px; color: var(--text); line-height: 1.65;
  width: 270px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.6);
  font-family: var(--sans); font-weight: 400; text-transform: none; letter-spacing: 0; pointer-events: none;
}
.tt-pop::before {
  content: ''; position: absolute; left: -5px; top: 50%; transform: translateY(-50%);
  border: 5px solid transparent; border-right-color: var(--accent2);
}
.tt-wrap:hover .tt-pop { display: block; }

/* inputs */
input[type=text], input[type=number], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text); font-family: var(--mono); font-size: 12.5px;
  padding: 7px 10px; outline: none; transition: border-color .2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,.1);
}
textarea { resize: vertical; min-height: 60px; }
select { cursor: pointer; }
select option { background: var(--panel2); }
.input-row { display: flex; gap: 6px; align-items: center; }
.unit-tag {
  font-family: var(--mono); font-size: 11px; color: var(--text2); white-space: nowrap;
  padding: 7px 9px; background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
}
.param-hint { font-size: 10.5px; color: var(--text2); margin-top: 5px; font-family: var(--mono); }
.multi-row { display: flex; flex-direction: column; gap: 6px; }
.multi-entry { display: flex; gap: 6px; align-items: center; }
.add-btn {
  font-size: 11px; font-family: var(--mono); color: var(--accent); background: transparent;
  border: 1px dashed rgba(0,212,170,.4); border-radius: 4px; padding: 5px 12px;
  cursor: pointer; margin-top: 6px; transition: all .15s; width: 100%; text-align: center;
}
.add-btn:hover { background: rgba(0,212,170,.07); border-style: solid; }
.action-btn {
  width: 100%; padding: 10px 14px; font-size: 12px; font-family: var(--mono); font-weight: 600;
  color: #000; background: var(--accent); border: none; border-radius: 6px; cursor: pointer; transition: all .2s;
}
.action-btn:hover { background: #00ebb8; }
.action-btn.done { background: rgba(0,212,170,.18); color: var(--accent); border: 1px solid rgba(0,212,170,.45); }
.action-hint {
  margin-top: 8px; font-size: 11px; line-height: 1.6; color: var(--text2);
}
.del-btn {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.del-btn:hover { border-color: var(--accent3); color: var(--accent3); }

.radio-group { display: flex; flex-wrap: wrap; gap: 7px; }
.radio-pill {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  font-size: 12px; font-family: var(--mono); cursor: pointer; color: var(--text2);
  transition: all .15s; background: transparent; user-select: none;
}
.radio-pill:hover { border-color: var(--accent); color: var(--accent); }
.radio-pill.sel { background: rgba(0,212,170,.12); border-color: var(--accent); color: var(--accent); }

.file-input-wrap {
  display: flex; gap: 6px; align-items: center;
}
.file-btn {
  padding: 6px 12px; font-size: 11px; font-family: var(--mono);
  background: rgba(0,212,170,.1); border: 1px solid rgba(0,212,170,.35); color: var(--accent);
  border-radius: 4px; cursor: pointer; white-space: nowrap; transition: all .15s;
}
.file-btn:hover { background: rgba(0,212,170,.2); }
.file-name { font-family: var(--mono); font-size: 11px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rlc-grid { display: grid; grid-template-columns: 1fr repeat(3, 60px); gap: 6px; align-items: center; }
.rlc-hdr { font-family: var(--mono); font-size: 10px; color: var(--text2); text-align: center; padding: 3px 0; }
.rlc-name { font-family: var(--mono); font-size: 12px; color: var(--text3); }

.nav-btn-row { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 0 2px; }
.btn-next, .btn-prev {
  padding: 8px 24px; font-size: 13px; font-family: var(--mono); font-weight: 600;
  border-radius: 6px; cursor: pointer; transition: all .2s;
}
.btn-next { background: var(--accent); color: #000; border: none; }
.btn-next:hover { background: #00ebb8; }
.btn-prev { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-prev:hover { border-color: var(--text2); color: var(--text); }

/* BOTTOM: guide */
.dash-bottom { flex: 1; overflow-y: auto; background: var(--bg); padding: 14px 22px; }
.guide-tabs { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.guide-tab {
  padding: 6px 14px; font-size: 12px; font-family: var(--mono); color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .2s;
}
.guide-tab:hover { color: var(--text); }
.guide-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.guide-pane { display: none; }
.guide-pane.active { display: block; }

.diagram-wrap {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 14px;
}
.diagram-title { font-size: 11px; color: var(--text2); margin-bottom: 10px; font-family: var(--mono); }
.flow-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.flow-box {
  padding: 5px 12px; border-radius: 5px; font-family: var(--mono); font-size: 11px;
  font-weight: 600; border: 1.5px solid;
}
.fb-src { color: var(--accent3); border-color: var(--accent3); background: rgba(255,123,114,.08); }
.fb-proc { color: var(--accent2); border-color: var(--accent2); background: rgba(56,139,253,.08); }
.fb-out { color: var(--accent); border-color: var(--accent); background: rgba(0,212,170,.08); }
.fb-warn { color: var(--accent4); border-color: var(--accent4); background: rgba(227,179,65,.08); }
.flow-arr { color: var(--text2); font-size: 16px; }

.code-wrap { border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
.code-bar {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  background: var(--panel); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--text2);
}
.code-dot { width: 10px; height: 10px; border-radius: 50%; }
pre.code-body {
  background: #0d1117; padding: 14px; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.75; overflow-x: auto; color: var(--text2);
}
.ck { color: #ff7b72; } .cs { color: #a5d6ff; } .cn { color: #79c0ff; }
.cm { color: #6e7681; } .cf { color: #d2a8ff; } .cp { color: var(--accent4); }

.note-box {
  background: rgba(227,179,65,.07); border: 1px solid rgba(227,179,65,.3);
  border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--text2); line-height: 1.65;
  margin-top: 10px;
}
.note-box strong { color: var(--accent4); }

/* ── RIGHT SIDEBAR ── */
.ref-panel {
  background: var(--panel); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 16px;
}
.ref-hdr {
  font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 1.5px;
  text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.ref-hdr::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.ref-card {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; margin-bottom: 10px; font-size: 12px; line-height: 1.7;
}
.ref-sec-tag { font-family: var(--mono); font-size: 10px; color: var(--accent2); margin-bottom: 6px; font-weight: 600; }
.ref-body { color: var(--text2); font-size: 11.5px; line-height: 1.7; }
.ref-body code {
  font-family: var(--mono); color: var(--accent); background: rgba(0,212,170,.08);
  padding: 1px 5px; border-radius: 3px; font-size: 11px;
}
.ref-body ul { padding-left: 16px; margin-top: 4px; }
.ref-body li { margin-bottom: 3px; }
.ref-body strong { color: var(--text); }
.ref-media { margin-top: 10px; }
.ref-media img {
  display: block; width: 100%; height: auto; border-radius: 6px;
  border: 1px solid var(--border); background: #fff;
}
.ref-caption {
  margin-top: 6px; font-size: 10.5px; color: var(--text2);
  font-family: var(--mono); line-height: 1.5;
}

.layout.manual-mode { grid-template-columns: 1fr; }
.layout.manual-mode .nav-panel,
.layout.manual-mode .ref-panel { display: none; }
.layout.manual-mode .center-panel { grid-column: 1; }
.layout.manual-mode .dash-top { display: none; }
.layout.manual-mode .dash-bottom {
  padding: 18px 22px;
  background: var(--panel);
}
.manual-shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}
.manual-hero {
  background: linear-gradient(135deg, rgba(227,179,65,.12), rgba(56,139,253,.08));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.manual-kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .8px;
  color: var(--accent4);
  text-transform: uppercase;
}
.manual-title {
  margin-top: 8px;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.manual-desc {
  margin-top: 8px;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text2);
  max-width: 960px;
}
.manual-actions {
  margin-top: 12px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.manual-link {
  display: inline-flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11.5px;
  transition: all .2s;
}
.manual-link:hover {
  border-color: var(--accent4);
  color: var(--accent4);
}
.manual-frame-wrap {
  flex: 1;
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #08111d;
}
.manual-frame {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #fff;
}

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

.hidden { display: none !important; }
.tag-3of3 {
  font-family: var(--mono); font-size: 10px; color: var(--accent4);
  background: rgba(227,179,65,.1); border: 1px solid rgba(227,179,65,.3);
  padding: 2px 8px; border-radius: 3px; margin-left: 6px;
}
</style>
</head>

  section: '§ Totem识别器件及其端口的过程原理',
  imageSrc: REF_IMG_TOTEM_DEVICE_PORT_PRINCIPLE,
  imageAlt: 'Totem识别器件及其端口的过程原理配图',
  imageCaption: '配图来自 docx 原文：MOS 器件与 G / DS 端口识别关系示意。',
  body: `通过计算器件端口的的坐标也能够确定相应的端口在RLC上的节点：
“Generally, to snap a transistor to contact, GDS2DB follows an algorithm based on the 
transistor device type (such as TYPE M = MOS, TYPE D = Diode, TYPE Q = BJT) using 
the specific layout for that device.”意思就是说，totem默认不同的器件都有特定的layout：针对某一类器件，器件具有的端口是固定不变的，比如MOS管具有源漏栅三个端口，其端口与器件的原点坐标的相对位置关系一致；而且某一类器件的某一个端口，端口都是通过特定一个或者几个类型层次的图层关系指定，比如NMOS的源漏都是经过cont&& nd运算得到，而栅极是通过或者cont&&poly运算得到。
Totem总共可识别14个层次类型，准确的说是13个，因为temp类型用于运算1-13个类型的层次：
m = metal, 
v = via
mim | mcap| c = metal cap
cont | contact = contact layer connecting to meta1 to diffusion or poly
pd | pdiff = p-diffusion
nd | ndiff = n-diffusion
nw | nwell = n-well layer
pw | pwell = p-well layer
poly = poly silicon layer
polyres = poly-resistor marker layer to recognize poly resistor geometries
d | diode = diode marker layer to identify a diode device
bjt = BJT marker layer to identify a BJT device from layout
sil = Silicide layer to identify active silicide region from layout
temp = A temporary layer used for doing further boolean operation to generate final layer geometries. See the Logical layer Operations section for more details.
Totem如何确定器件与端口的所属关系呢？下面以MOS管为例进行介绍：
如上图所示，通过以下步骤可以确定器件MOS2跟端口的对应关系：
通过poly&&nd或者poly&&pd运算得到channel，即MOS管，并建立channel和poly的一对一的对应关系以及channel与nd或者pd的一一对应关系：
MOS2—poly2和MOS2—pd/nd2
针对特定的channel，将对应的poly与cont做poly&&cont运算得到多个栅极端口：
G terminal1、 G terminal3、 G terminal7
针对特定的channel，将相应的nd或者pd与cont做cont&&nd或者cont&&pd运算得到多个源漏端口：
DS terminal3、DS terminal4、DS terminal5、DS terminal6
按照“属于器件的端口离器件沟道最近”的原则确定端口：
G terminal1、 G terminal3、 G terminal7中G terminal1、 G terminal3离MOS2最近；
DS terminal3、DS terminal4、DS terminal5、DS terminal6中DS terminal3、DS terminal4离MOS2最近。

const REF_CIRCUIT_LAYOUT_MAPPING = {
  section: '§ 电路器件和版图器件对应关系建立方案',
  body: `由于电路中的器件和版图中的器件是一对多的关系，若评估电流的时候是对电路网表中的器件端口进行评估，就需要提供电路中的器件和版图中的器件的映射关系，确保端口电流分配到版图器件的端口。由于版图中器件的坐标是唯一的，只需提供版图器件的坐标与电路中器件的映射关系。一般有以下几个方案：
用layout导出的layout电路网表（LVS后生成的layout spice netlist或者后仿网表）提取probe并做电路仿真，同时也用该文件去指定版图内的器件（器件的坐标），这样一来，本来提取probe的时候就是指定对layout中的期间端口提取信号，所以提取到的信号与版图内的器件便是一一对应的关系，无需再做分配。
用不是版图导出的电路网表去做电路仿真，用电路网表和版图去做寄生提取，并且指定将电路网表的实例名作为寄生提取的网表中的器件名，同时用寄生提取的网表确定版图中的器件的位置（带器件的原点坐标）。
用不是版图导出的电路网表去做电路仿真，用电路网表和版图做LVS，用LVS生成的器件、net交叉对照文件来确定电路与版图器件的对应关系，再用版图导出的电路网表去指定版图中器件的位置。`
};

function tt(note) {
  if (!note) return '';
  const safe = note.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  return `<span class="tt-wrap"><span class="tt-btn">?</span><span class="tt-pop">${note}</span></span>`;
}

function renderFileInput(id, placeholder) {
  return `<div class="file-input-wrap">
    <label class="file-btn" for="fi_${id}">选择文件</label>
    <input type="file" id="fi_${id}" style="display:none" onchange="handleFile('${id}',this)">
    <span class="file-name" id="fn_${id}">${placeholder || '未选择文件'}</span>
  </div>`;
}

function handleFile(id, input) {
  const fn = document.getElementById('fn_' + id);
  if (fn && input.files[0]) {
    fn.textContent = input.files[0].name;
    fn.style.color = 'var(--accent)';
    setVal(id, input.files[0].name);
    checkCompletion();
  }
}

function setVal(id, val) {
  formValues[id] = val;
}

function getVal(id) { return formValues[id] || ''; }

function triggerActionButton(id, stepId, tabIdx) {
  setVal(id, 'done');
  if (stepId) activeGuideTabs[stepId] = tabIdx;
  renderStep(currentStepIdx);
}

function renderParam(p) {
  switch (p.type) {
    case 'file': return `
      <div class="param-card">
        <div class="param-lbl"><span class="req-star">✦</span> ${p.label} ${p.note ? tt(p.note) : ''}</div>

      </div>`;

    case 'text': return `
      <div class="param-card">
        <div class="param-lbl"><span class="req-star">✦</span> ${p.label} ${p.note ? tt(p.note) : ''}</div>
        <input type="text" id="inp_${p.id}" placeholder="${p.placeholder || ''}" oninput="setVal('${p.id}',this.value);checkCompletion()">
      </div>`;

    case 'number': return `

          <span class="param-hint">金属层</span>
          <span class="param-hint">方阻 (Ω/□)</span>
          <span></span>
        </div>
        <div class="multi-row" id="lr_${p.id}">
          ${renderLayerResRow(p.id, 0)}
        </div>
        <button class="add-btn" onclick="addLayerResRow('${p.id}')">+ 添加金属层</button>
      </div>`;

    case 'multi_layer_thick': return `
      <div class="param-card wide">
        <div class="param-lbl"><span class="req-star">✦</span> ${p.label} ${p.note ? tt(p.note) : ''}</div>
        <div style="display:grid;grid-template-columns:1fr 120px 28px;gap:6px;margin-bottom:6px">
          <span class="param-hint">金属层</span>
          <span class="param-hint">厚度 (nm)</span>
          <span></span>
        </div>
        <div class="multi-row" id="lt_${p.id}">
          ${renderLayerThickRow(p.id, 0)}
        </div>
        <button class="add-btn" onclick="addLayerThickRow('${p.id}')">+ 添加金属层</button>
      </div>`;

    default: return '';
  }
}

function renderKVRow(pid, idx, kp, vp, vt) {
  return `<div class="multi-entry" id="kvrow_${pid}_${idx}">
    <input type="text" placeholder="${kp || '键'}" style="flex:1" oninput="setVal('${pid}_k_${idx}',this.value)">
    <input type="${vt || 'text'}" placeholder="${vp || '值'}" style="width:120px" step="any" oninput="setVal('${pid}_v_${idx}',this.value)">
    <button class="del-btn" onclick="delRow('kvrow_${pid}_${idx}')">×</button>
  </div>`;
}

function renderRLCRow(pid, idx) {
  return `<div class="multi-entry" id="rlcrow_${pid}_${idx}">
    <input type="text" placeholder="名称" style="flex:1" oninput="setVal('${pid}_n_${idx}',this.value)">
    <input type="number" placeholder="R" style="width:80px" step="any" oninput="setVal('${pid}_r_${idx}',this.value)">
    <input type="number" placeholder="L" style="width:80px" step="any" oninput="setVal('${pid}_l_${idx}',this.value)">
    <input type="number" placeholder="C" style="width:80px" step="any" oninput="setVal('${pid}_c_${idx}',this.value)">
    <button class="del-btn" onclick="delRow('rlcrow_${pid}_${idx}')">×</button>
  </div>`;
}

function renderLayerResRow(pid, idx) {
  return `<div class="multi-entry" id="lrrow_${pid}_${idx}">
    <input type="text" placeholder="e.g. M1" style="flex:1" oninput="setVal('${pid}_ln_${idx}',this.value)">
    <input type="number" placeholder="方阻值" style="width:120px" step="any" oninput="setVal('${pid}_lv_${idx}',this.value)">
    <button class="del-btn" onclick="delRow('lrrow_${pid}_${idx}')">×</button>
  </div>`;
}

function renderLayerThickRow(pid, idx) {
  return `<div class="multi-entry" id="ltrow_${pid}_${idx}">
    <input type="text" placeholder="e.g. M1" style="flex:1" oninput="setVal('${pid}_tn_${idx}',this.value)">
    <input type="number" placeholder="厚度值" style="width:120px" step="any" oninput="setVal('${pid}_tv_${idx}',this.value)">
    <button class="del-btn" onclick="delRow('ltrow_${pid}_${idx}')">×</button>
  </div>`;
}

let rowCounters = {};
function getRowCtr(pid) {
  rowCounters[pid] = (rowCounters[pid] || 1);
  return rowCounters[pid]++;
}

function addKVRow(pid, kp, vp, vt) {
  const c = getRowCtr(pid);
  document.getElementById('mr_' + pid).insertAdjacentHTML('beforeend', renderKVRow(pid, c, kp, vp, vt));
}
function addRLCRow(pid) {
  const c = getRowCtr(pid);
  document.getElementById('rlc_' + pid).insertAdjacentHTML('beforeend', renderRLCRow(pid, c));
}
function addLayerResRow(pid) {
  const c = getRowCtr(pid);
  document.getElementById('lr_' + pid).insertAdjacentHTML('beforeend', renderLayerResRow(pid, c));
}
function addLayerThickRow(pid) {
  const c = getRowCtr(pid);
  document.getElementById('lt_' + pid).insertAdjacentHTML('beforeend', renderLayerThickRow(pid, c));
}
function delRow(id) {
  const el = document.getElementById(id);
  if (el && el.parentNode.children.length > 1) el.remove();
}

function selectRadio(pid, el, val) {
  el.closest('.radio-group').querySelectorAll('.radio-pill').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel');
  setVal(pid, val);
  checkCompletion();
}

function selectChoice(cid, stepId) {
  choiceSelections[stepId] = cid;
  document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('cc_' + cid).classList.add('selected');
  // show/hide conditional params
  const step = activeSteps.find(s => s.id === stepId);
  if (step && step.paramsConditional) {
    Object.keys(step.paramsConditional).forEach(k => {
      const el = document.getElementById('cond_' + stepId + '_' + k);
      if (el) el.classList.toggle('hidden', k !== cid);
    });
  }
  checkCompletion();
}

// ═══════════════════════════════════════════════════════════
//  RENDER NAV
// ═══════════════════════════════════════════════════════════
function renderNav() {
  const nav = document.getElementById('navPanel');
  if (currentMode === 'manual') {
    nav.innerHTML = '';
    return;
  }
  let html = '';
  activeSteps.forEach((step, idx) => {
    const done = !!stepsDone[step.id];
    const active = idx === currentStepIdx;
    html += `<div class="nav-item ${active ? 'active' : ''} ${done ? 'done-item' : ''}"
      onclick="goStep(${idx})">
      <div class="nav-badge">
        <span class="nav-num-txt">${idx + 1}</span>
        <span class="nav-check">✓</span>
      </div>
      <div class="nav-label">${step.title}</div>
    </div>`;
  });
  nav.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
//  RENDER STEP
// ═══════════════════════════════════════════════════════════
function renderStep(idx) {
  if (currentMode === 'manual') {
    renderManualMode();
    return;
  }
  const step = activeSteps[idx];
  if (!step) return;

  // ── TOP: dashboard ──
  let topHtml = '';
  topHtml += `<div class="step-hdr">
    <div class="step-tag ${step.tag}">${step.tagLabel} · Step ${idx + 1}</div>
    <div>
      <div class="step-title">${step.title}</div>
      <div class="step-desc">${step.desc}${step.descNote ? ' ' + tt(step.desc) : ''}</div>
    </div>
  </div>`;

  // choice group
  if (step.choiceGroup) {
    const cg = step.choiceGroup;
    topHtml += `<div class="section-label">选择方式 ${tt(cg.note)}</div>
    <div class="choice-group">`;
    cg.choices.forEach(ch => {
      const sel = choiceSelections[step.id] === ch.id;
      topHtml += `<div class="choice-card ${sel ? 'selected' : ''}" id="cc_${ch.id}" onclick="selectChoice('${ch.id}','${step.id}')">
        <div class="choice-title">${ch.title} ${tt(ch.note)}</div>
        <div class="choice-desc">${ch.desc}</div>
      </div>`;
    });
    topHtml += '</div>';
    // conditional params
    if (step.paramsConditional) {
      Object.keys(step.paramsConditional).forEach(k => {
        const show = choiceSelections[step.id] === k;
        topHtml += `<div id="cond_${step.id}_${k}" class="${show ? '' : 'hidden'}">
          <div class="section-label">相关参数</div>
          <div class="param-grid">`;
        step.paramsConditional[k].forEach(p => { topHtml += renderParam(p); });
        topHtml += '</div></div>';
      });
    }
  }

  // extra params (e.g. region-power on s2)
  if (step.extraParams) {
    topHtml += `<div class="section-label">通用参数</div><div class="param-grid">`;
    step.extraParams.forEach(p => { topHtml += renderParam(p); });
    topHtml += '</div>';
  }

  // regular params
  if (step.params && step.params.length) {
    topHtml += `<div class="section-label">需要指定的参数</div><div class="param-grid">`;
    step.params.forEach(p => { topHtml += renderParam(p); });
    topHtml += '</div>';
  }

  // extra note
  if (step.extraNote) {
    topHtml += `<div class="note-box" style="margin-top:12px"><strong>注：</strong> ${step.extraNote}</div>`;
  }

  // nav buttons
  topHtml += `<div class="nav-btn-row">
    ${idx > 0 ? `<button class="btn-prev" onclick="goStep(${idx - 1})">← 上一步</button>` : ''}
    <button class="btn-next" onclick="markDone(${idx})">${idx < activeSteps.length - 1 ? '下一步 →' : '✓ 完成配置'}</button>
  </div>`;

  document.getElementById('dashTop').innerHTML = topHtml;

  // ── BOTTOM: guide ──
  const guide = step.guide || {};
  const tabs = guide.tabs || ['说明'];
  const curTab = activeGuideTabs[step.id] || 0;

  let botHtml = `<div class="guide-tabs">`;
  tabs.forEach((t, i) => {
    botHtml += `<div class="guide-tab ${i === curTab ? 'active' : ''}" onclick="switchGuideTab(${i},'${step.id}')">${t}</div>`;
  });
  botHtml += '</div>';

  if (tabs[curTab] === '示意图' || tabs[curTab] === '流程图' || tabs[curTab] === '方法对比' || tabs[curTab] === '对应关系方案') {
    botHtml += guide.diagram || '';
    if (guide.note) botHtml += `<div class="note-box" style="margin-top:10px">${guide.note}</div>`;
  } else if (tabs[curTab] === '操作指引') {
    botHtml += guide.operation || '';
    if (guide.note) botHtml += `<div class="note-box" style="margin-top:10px">${guide.note}</div>`;
  } else if (tabs[curTab] === '代码示例') {
    botHtml += guide.code || '';
    if (guide.note) botHtml += `<div class="note-box" style="margin-top:10px">${guide.note}</div>`;
  } else {
    // 说明
    botHtml += guide.diagram || '';
    if (guide.note) botHtml += `<div class="note-box" style="margin-top:10px">${guide.note}</div>`;
  }

  document.getElementById('dashBottom').innerHTML = botHtml;

  // ── RIGHT: refs ──
  let refHtml = `<div class="ref-hdr">📎 引用小节（南星的思考与理解）</div>`;
  (step.refs || []).forEach(r => {
    refHtml += `<div class="ref-card">
      <div class="ref-sec-tag">${r.section}</div>
      <div class="ref-body">${r.body.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</div>
      ${r.imageSrc ? `<div class="ref-media">
        <img src="${r.imageSrc}" alt="${r.imageAlt || r.section}">
        ${r.imageCaption ? `<div class="ref-caption">${r.imageCaption}</div>` : ''}
      </div>` : ''}
    </div>`;
  });
  document.getElementById('refPanel').innerHTML = refHtml;
}

function renderManualMode() {
  document.getElementById('dashTop').innerHTML = '';
  document.getElementById('refPanel').innerHTML = '';
  document.getElementById('dashBottom').innerHTML = `
    <div class="manual-shell">
      <section class="manual-hero">
        <div class="manual-kicker">Manual Subpage</div>
        <div class="manual-title">TOTEM IREM 操作手册</div>
        <div class="manual-desc">
          当前副页已集成 <code>${MANUAL_GUIDE_FILE}</code>，作为与“静态 IR / 动态 IR”并列的第三个入口。
          手册内容保持独立维护，主页面只负责承载与切换，后续更新手册时无需再改向导主体结构。
        </div>
        <div class="manual-actions">
          <a class="manual-link" href="${MANUAL_GUIDE_FILE}" target="_blank" rel="noopener">单独打开手册</a>
        </div>
      </section>
      <div class="manual-frame-wrap">
        <iframe class="manual-frame" src="${MANUAL_GUIDE_FILE}" title="TOTEM IREM 操作手册"></iframe>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════════════════
function updateHeaderStatus() {
  const hdr = document.getElementById('hdrStatus');
  if (currentMode === 'manual') {
    hdr.textContent = '副页 · 操作手册';
    return;
  }
  hdr.innerHTML = `共 <span id="totalSteps">${activeSteps.length}</span> 步`;
}

function updateProgress() {
  if (currentMode === 'manual') {
    document.getElementById('progFill').style.width = '100%';
    document.getElementById('progPct').textContent = '手册';
    return;
  }
  const done = activeSteps.filter(s => stepsDone[s.id]).length;
  const total = activeSteps.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent = pct + '%';
}

function checkCompletion() {}

function markDone(idx) {
  if (currentMode === 'manual') return;
  const step = activeSteps[idx];
  stepsDone[step.id] = true;
  renderNav();
  updateProgress();
  if (idx < activeSteps.length - 1) goStep(idx + 1);
}

function goStep(idx) {
  if (currentMode === 'manual') return;
  currentStepIdx = idx;
  renderNav();
  renderStep(idx);
  document.getElementById('dashTop').scrollTop = 0;
}

function switchGuideTab(tabIdx, stepId) {
  if (currentMode === 'manual') return;
  activeGuideTabs[stepId] = tabIdx;
  renderStep(currentStepIdx);
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.querySelector(`.mode-btn[data-mode="${mode}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const layout = document.querySelector('.layout');
  layout.classList.toggle('manual-mode', mode === 'manual');

  activeSteps = mode === 'static' ? STEPS_STATIC : mode === 'dynamic' ? STEPS_DYNAMIC : [];
  currentStepIdx = 0;
  updateHeaderStatus();
  renderNav();
  if (mode === 'manual') {
    renderManualMode();
  } else {
    renderStep(0);
  }
  updateProgress();
}

function openBrandModal() {
  const modal = document.getElementById('brandModal');
  if (!modal) return;
  modal.classList.remove('hidden');
  modal.classList.add('open');
}

function closeBrandModal() {
  const modal = document.getElementById('brandModal');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeBrandModal();
});

// ─── INIT ───
updateHeaderStatus();
renderNav();
renderStep(0);
updateProgress();
</script>
</body>
</html>
